<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f1">
  <title>Para vos 🌻</title>

  <!-- Bootstrap (solo CSS: la lógica es JS propio, así no dependemos del JS del CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --fondo: #fbf8f1;
      --texto: #2f2a24;
      --texto-suave: #5b5249;
      --dorado: #b8862b;
      --boton: #e9b824;
      --boton-oscuro: #d19c10;
      --fuente-sans: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --fuente-serif: 'Lora', Georgia, 'Times New Roman', serif;
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--texto);
      font-family: var(--fuente-sans);
      background: radial-gradient(ellipse at top, #ffffff 0%, var(--fondo) 55%, #f2ead9 100%);
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- Escena principal ---------- */
    .escena {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(env(safe-area-inset-top, 0px) + 1.5rem) 1.25rem calc(env(safe-area-inset-bottom, 0px) + 1.25rem);
    }

    .titulo {
      font-weight: 700;
      font-size: clamp(1.9rem, 8vw, 2.6rem);
      letter-spacing: -0.5px;
      margin: 0 0 0.6rem;
    }

    .razones { list-style: none; padding: 0; margin: 0; }

    .razones li {
      font-weight: 500;
      font-size: clamp(1.05rem, 4.6vw, 1.3rem);
      line-height: 1.85;
      color: var(--texto-suave);
      animation: aparecer 0.6s ease both;
    }

    .remate {
      margin: 0.5rem 0 0;
      font-weight: 600;
      font-size: clamp(1.1rem, 5vw, 1.4rem);
      color: var(--dorado);
      animation: aparecer 0.9s ease both;
    }

    /* ---------- Planta ---------- */
    .jardin {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-top: 1rem;
    }

    .jardin svg {
      height: 100%;
      max-height: 440px;
      width: auto;
      max-width: 100%;
      overflow: visible;
    }

    #tallo {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transition: transform 1.1s cubic-bezier(.22, .8, .3, 1);
    }

    .hoja {
      transform-box: fill-box;
      transform-origin: 0% 50%;
      transform: scale(0);
      transition: transform 0.7s cubic-bezier(.34, 1.56, .64, 1);
    }
    .hoja.visible { transform: scale(1); }

    #flor { cursor: pointer; }

    .flor-interna { transform-box: fill-box; transform-origin: 50% 50%; }
    .petalo, .centro { transform-box: fill-box; transform: scale(0); }
    .petalo { transform-origin: 50% 100%; }
    .centro { transform-origin: 50% 50%; }

    .florecer .flor-interna { animation: girar 1.8s cubic-bezier(.22, .8, .3, 1) both; }
    .florecer .centro { animation: brotar 0.6s 0.1s cubic-bezier(.34, 1.56, .64, 1) forwards; }
    .florecer .petalo { animation: brotar 0.6s cubic-bezier(.34, 1.56, .64, 1) forwards; }

    #planta { transform-box: view-box; transform-origin: 100px 300px; }
    .balanceo #planta { animation: balanceo 4s ease-in-out infinite; }

    /* ---------- Botones ---------- */
    .acciones {
      width: 100%;
      max-width: 380px;
      margin-top: 1.25rem;
      transition: opacity 0.4s ease;
    }
    .acciones.oculto { opacity: 0; pointer-events: none; }

    .btn-amor {
      padding: 0.95rem 1.5rem;
      font-weight: 600;
      font-size: 1.15rem;
      color: #fff;
      text-shadow: 0 1px 2px rgba(120, 80, 0, 0.35);
      background: linear-gradient(180deg, var(--boton) 0%, var(--boton-oscuro) 100%);
      border: none;
      box-shadow: 0 8px 20px rgba(209, 156, 16, 0.35);
      touch-action: manipulation;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    }
    .btn-amor:hover, .btn-amor:focus { color: #fff; background: linear-gradient(180deg, #efc233 0%, var(--boton-oscuro) 100%); }
    .btn-amor:active { transform: scale(0.97); box-shadow: 0 4px 10px rgba(209, 156, 16, 0.35); }
    .btn-amor:focus-visible { outline: 3px solid #8a5d00; outline-offset: 3px; }
    .btn-amor:disabled { color: #fff; opacity: 0.75; }

    /* ---------- Popup ---------- */
    .popup-fondo {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 1rem 1rem calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
      background: rgba(250, 246, 236, 0.45);
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);
      animation: fundido 0.4s ease both;
    }
    .popup-fondo[hidden] { display: none; }
    .popup-fondo.saliendo { animation: fundido 0.35s ease reverse both; }

    .popup-tarjeta {
      width: 100%;
      max-width: 440px;
      padding: 2rem 1.5rem 1.5rem;
      border-radius: 30px;
      background: #fff;
      box-shadow: 0 20px 50px rgba(80, 60, 20, 0.18);
      animation: subir 0.55s cubic-bezier(.22, .8, .3, 1) both;
    }

    .corazon { width: 64px; height: 64px; animation: latido 1.4s ease-in-out infinite; }

    .popup-mensaje {
      margin: 1.25rem 0 1.75rem;
      font-family: var(--fuente-serif);
      font-weight: 500;
      font-size: clamp(1.35rem, 5.6vw, 1.75rem);
      line-height: 1.45;
      color: var(--texto);
    }
    .popup-mensaje .resaltado { color: var(--dorado); font-weight: 600; }

    #confeti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

    /* ---------- Animaciones ---------- */
    @keyframes aparecer { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes fundido  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes subir    { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
    @keyframes brotar   { 0% { transform: scale(0); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
    @keyframes girar    { from { transform: rotate(-70deg); } to { transform: rotate(0); } }
    @keyframes balanceo { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
    @keyframes latido   { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <main class="escena text-center">
    <header>
      <h1 class="titulo" id="titulo"></h1>
      <ul class="razones" id="razones" aria-live="polite"></ul>
      <p class="remate" id="remate" hidden></p>
    </header>

    <div class="jardin" id="jardin">
      <svg id="svgPlanta" viewBox="0 0 200 390" role="img" aria-label="Maceta con una planta que crece">
        <defs>
          <linearGradient id="gMaceta" x1="0" x2="1">
            <stop offset="0" stop-color="#a4552f"/><stop offset=".5" stop-color="#cf8250"/><stop offset="1" stop-color="#9c4f2b"/>
          </linearGradient>
          <linearGradient id="gBorde" x1="0" x2="1">
            <stop offset="0" stop-color="#9a4e2b"/><stop offset=".5" stop-color="#c47446"/><stop offset="1" stop-color="#934a28"/>
          </linearGradient>
          <linearGradient id="gTallo" x1="0" x2="1">
            <stop offset="0" stop-color="#2e8b3a"/><stop offset=".5" stop-color="#4caf50"/><stop offset="1" stop-color="#2e7d32"/>
          </linearGradient>
          <linearGradient id="gHoja" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5cbf60"/><stop offset="1" stop-color="#2e7d32"/>
          </linearGradient>
          <radialGradient id="gPetalo" cx=".5" cy=".85" r=".9">
            <stop offset="0" stop-color="#ffdc55"/><stop offset="1" stop-color="#f5b800"/>
          </radialGradient>
          <radialGradient id="gCentro" cx=".4" cy=".35" r=".75">
            <stop offset="0" stop-color="#7a4f2a"/><stop offset="1" stop-color="#4a2c14"/>
          </radialGradient>
        </defs>

        <ellipse cx="100" cy="384" rx="58" ry="5" fill="rgba(80,50,20,.12)"/>

        <g id="planta">
          <rect id="tallo" x="96" y="70" width="8" height="232" rx="4" fill="url(#gTallo)"/>
          <g id="hojas"></g>
          <g id="flor" transform="translate(100 70)">
            <g class="flor-interna"></g>
          </g>
        </g>

        <g id="maceta">
          <path d="M52 310 H148 L146 342 Q144 382 108 382 H92 Q56 382 54 342 Z" fill="url(#gMaceta)"/>
          <rect x="38" y="288" width="124" height="26" rx="9" fill="url(#gBorde)"/>
          <ellipse cx="100" cy="316" rx="46" ry="4" fill="rgba(90,40,15,.25)"/>
        </g>

        <path id="gota" d="M0 -12 C5 -5 8 -1 8 4 A8 8 0 0 1 -8 4 C-8 -1 -5 -5 0 -12 Z" fill="#5ab3f0" opacity="0"/>
      </svg>
    </div>

    <div class="acciones" id="acciones">
      <button type="button" class="btn btn-amor rounded-pill w-100" id="btnRegar"></button>
    </div>
  </main>

  <div class="popup-fondo" id="popup" role="dialog" aria-modal="true" aria-labelledby="popupMensaje" hidden>
    <div class="popup-tarjeta text-center">
      <svg class="corazon" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="gCorazon" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffd84a"/><stop offset="1" stop-color="#f29a0a"/>
          </linearGradient>
        </defs>
        <path fill="url(#gCorazon)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <p class="popup-mensaje" id="popupMensaje"></p>
      <button type="button" class="btn btn-amor rounded-pill w-100" id="btnFlor"></button>
    </div>
  </div>

  <canvas id="confeti" aria-hidden="true"></canvas>

  <script>
    /* =========================================================
       CONFIGURACIÓN — todo lo que se personaliza está aquí
       ========================================================= */
    const CONFIG = {
      titulo: 'Te amo porque:',

      // Agrega o quita las que quieras: la planta se ajusta sola.
      razones: [
        'Sos hermosa',
        'Sos divertida',
        'Sos mi hogar',
        'Sos auténtica',
        'Sos inspiradora'
      ],

      // Texto del botón en cada riego. Si hay más razones que textos, se repite el último.
      textosBoton: [
        'Regar con amor 💛',
        'Otro poquito 💧',
        'Un poquito más 🌱',
        'Sigue creciendo 🌿',
        'Ya casi 🌼'
      ],

      botonFinal: 'Una última gota 💛',
      remate: 'Pero sobre todo te amo...',

      // Usa <span class="resaltado">...</span> para el texto dorado y <br> para saltos de línea.
      mensajeFinal: 'Porque <span class="resaltado">sos vos</span>.<br>Y estar con vos es lo más lindo que me ha pasado.',
      botonPopup: 'Ver la flor de mi amor 🌻',

      // Música opcional: ruta o URL de un .mp3 (ej. 'musica.mp3'). Vacío = sin música.
      musica: ''
    };

    /* =========================================================
       Utilidades
       ========================================================= */
    const $ = (sel) => document.querySelector(sel);
    const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
    const SVG_NS = 'http://www.w3.org/2000/svg';

    function crearSvg(tag, attrs = {}) {
      const el = document.createElementNS(SVG_NS, tag);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      return el;
    }

    /* =========================================================
       Planta: tallo, hojas y girasol
       ========================================================= */
    const Planta = (() => {
      const TALLO_BASE = 302;
      const TALLO_ALTO = 232;
      const total = CONFIG.razones.length;

      const tallo = $('#tallo');
      const contHojas = $('#hojas');
      const svg = $('#svgPlanta');
      const gota = $('#gota');
      const hojas = [];

      const fraccion = (etapa) => 0.1 + 0.9 * (etapa / total);
      const yTope = (etapa) => TALLO_BASE - fraccion(etapa) * TALLO_ALTO;

      function construirHojas() {
        const espacio = (0.9 * TALLO_ALTO) / total;
        for (let k = 1; k <= total; k++) {
          const izquierda = k % 2 === 1;
          const y = yTope(k) + espacio * 0.35;
          const x = izquierda ? 97 : 103;
          const exterior = crearSvg('g', {
            transform: `translate(${x} ${y}) ${izquierda ? 'scale(-1 1)' : ''} rotate(-8)`
          });
          const hoja = crearSvg('g', { class: 'hoja' });
          hoja.appendChild(crearSvg('path', {
            d: 'M0 0 C12 -18 38 -20 52 -6 C38 8 14 10 0 0 Z',
            fill: 'url(#gHoja)'
          }));
          hoja.appendChild(crearSvg('path', {
            d: 'M3 0 Q26 -6 46 -6',
            fill: 'none', stroke: 'rgba(255,255,255,.35)', 'stroke-width': '1.4', 'stroke-linecap': 'round'
          }));
          exterior.appendChild(hoja);
          contHojas.appendChild(exterior);
          hojas.push(hoja);
        }
      }

      function construirFlor() {
        const cont = $('#flor .flor-interna');
        const capas = [
          { n: 10, giro: 18, fill: '#f0ab00', rx: 13, ry: 24, cy: -33 },
          { n: 10, giro: 0, fill: 'url(#gPetalo)', rx: 14, ry: 24, cy: -31 }
        ];
        let orden = 0;
        capas.forEach((c) => {
          for (let i = 0; i < c.n; i++) {
            const g = crearSvg('g', { transform: `rotate(${i * (360 / c.n) + c.giro})` });
            const petalo = crearSvg('ellipse', { cx: 0, cy: c.cy, rx: c.rx, ry: c.ry, fill: c.fill, class: 'petalo' });
            petalo.style.animationDelay = `${0.3 + orden * 0.045}s`;
            orden++;
            g.appendChild(petalo);
            cont.appendChild(g);
          }
        });

        const centro = crearSvg('g', { class: 'centro' });
        centro.appendChild(crearSvg('circle', { r: 24, fill: 'url(#gCentro)' }));
        // Semillas en espiral (ángulo áureo)
        for (let i = 1; i < 26; i++) {
          const ang = i * 137.5 * (Math.PI / 180);
          const r = 3.9 * Math.sqrt(i);
          centro.appendChild(crearSvg('circle', {
            cx: (Math.cos(ang) * r).toFixed(2), cy: (Math.sin(ang) * r).toFixed(2),
            r: 1.3, fill: 'rgba(255,215,140,.22)'
          }));
        }
        cont.appendChild(centro);
      }

      function crecer(etapa) {
        tallo.style.transform = `scaleY(${fraccion(etapa)})`;
        if (etapa >= 1) setTimeout(() => hojas[etapa - 1].classList.add('visible'), 550);
      }

      function regar() {
        return gota.animate([
          { transform: 'translate(100px, 150px) scale(.6)', opacity: 0 },
          { transform: 'translate(100px, 190px) scale(1)', opacity: 1, offset: 0.25 },
          { transform: 'translate(100px, 292px) scale(.9)', opacity: 1, offset: 0.85 },
          { transform: 'translate(100px, 300px) scale(1.4, .3)', opacity: 0 }
        ], { duration: 700, easing: 'ease-in' }).finished;
      }

      function florecer() {
        svg.classList.add('florecer');
        setTimeout(() => svg.classList.add('balanceo'), 2200);
      }

      function iniciar() {
        construirHojas();
        construirFlor();
        crecer(0);
      }

      return { iniciar, crecer, regar, florecer, total };
    })();

    /* =========================================================
       Confeti (canvas, sin librerías)
       ========================================================= */
    const Confeti = (() => {
      const canvas = $('#confeti');
      const ctx = canvas.getContext('2d');
      const colores = ['#f7c948', '#f2b705', '#ffe08a', '#7bc67e', '#4caf50', '#f7a1c4', '#ffd6e7'];
      const reducido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let piezas = [];
      let finEmision = 0;
      let activo = false;

      function ajustar() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = innerWidth * dpr;
        canvas.height = innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function crear(y = -20) {
        return {
          x: Math.random() * innerWidth, y,
          w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
          vx: -0.6 + Math.random() * 1.2, vy: 1.6 + Math.random() * 2.4,
          rot: Math.random() * Math.PI * 2, vr: -0.12 + Math.random() * 0.24,
          osc: Math.random() * Math.PI * 2,
          color: colores[Math.floor(Math.random() * colores.length)],
          circulo: Math.random() < 0.3
        };
      }

      function cuadro(t) {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        if (t < finEmision && piezas.length < 260) {
          for (let i = 0; i < 3; i++) piezas.push(crear());
        }
        piezas = piezas.filter((p) => p.y < innerHeight + 30);

        for (const p of piezas) {
          p.osc += 0.05;
          p.x += p.vx + Math.sin(p.osc) * 0.6;
          p.y += p.vy;
          p.rot += p.vr;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          if (p.circulo) {
            ctx.beginPath();
            ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.scale(1, Math.cos(p.osc));
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          }
          ctx.restore();
        }

        if (piezas.length || t < finEmision) {
          requestAnimationFrame(cuadro);
        } else {
          activo = false;
          ctx.clearRect(0, 0, innerWidth, innerHeight);
        }
      }

      function lanzar(duracion = 4500) {
        ajustar();
        const n = reducido ? 40 : 140;
        for (let i = 0; i < n; i++) piezas.push(crear(-Math.random() * innerHeight));
        finEmision = performance.now() + (reducido ? 0 : duracion);
        if (!activo) {
          activo = true;
          requestAnimationFrame(cuadro);
        }
      }

      addEventListener('resize', ajustar);
      return { lanzar };
    })();

    /* =========================================================
       Música (opcional; arranca con el primer toque del usuario)
       ========================================================= */
    const Musica = (() => {
      let audio = null;
      function iniciar() {
        if (!CONFIG.musica || audio) return;
        audio = new Audio(CONFIG.musica);
        audio.loop = true;
        audio.play().catch(() => { /* el navegador puede bloquearla; no rompe nada */ });
      }
      return { iniciar };
    })();

    /* =========================================================
       Flujo de la experiencia
       ========================================================= */
    const App = (() => {
      const lista = $('#razones');
      const remate = $('#remate');
      const btnRegar = $('#btnRegar');
      const acciones = $('#acciones');
      const popup = $('#popup');
      const btnFlor = $('#btnFlor');
      let paso = 0;

      const textoBoton = (i) => CONFIG.textosBoton[Math.min(i, CONFIG.textosBoton.length - 1)];

      function mostrarRazon(texto) {
        const li = document.createElement('li');
        li.textContent = texto;
        lista.appendChild(li);
      }

      async function alRegar() {
        Musica.iniciar();
        btnRegar.disabled = true;

        if (paso < Planta.total) {
          await Planta.regar();
          mostrarRazon(CONFIG.razones[paso]);
          paso++;
          Planta.crecer(paso);
          btnRegar.textContent = paso < Planta.total ? textoBoton(paso) : CONFIG.botonFinal;
          await esperar(500);
          btnRegar.disabled = false;
          return;
        }

        // Último toque: remate y popup
        await Planta.regar();
        remate.hidden = false;
        acciones.classList.add('oculto');
        await esperar(1600);
        acciones.hidden = true;
        abrirPopup();
      }

      function abrirPopup() {
        popup.hidden = false;
        btnFlor.focus({ preventScroll: true });
      }

      async function alVerFlor() {
        btnFlor.disabled = true;
        popup.classList.add('saliendo');
        await esperar(350);
        popup.hidden = true;
        Planta.florecer();
        await esperar(700);
        Confeti.lanzar();
      }

      function iniciar() {
        $('#titulo').textContent = CONFIG.titulo;
        remate.textContent = CONFIG.remate;
        $('#popupMensaje').innerHTML = CONFIG.mensajeFinal;
        btnFlor.textContent = CONFIG.botonPopup;
        btnRegar.textContent = textoBoton(0);

        Planta.iniciar();
        btnRegar.addEventListener('click', alRegar);
        btnFlor.addEventListener('click', alVerFlor);
        // Tocar la flor ya abierta vuelve a lanzar confeti
        $('#flor').addEventListener('click', () => {
          if ($('#svgPlanta').classList.contains('florecer')) Confeti.lanzar(2500);
        });
      }

      return { iniciar };
    })();

    document.addEventListener('DOMContentLoaded', App.iniciar);
  </script>
</body>
</html>
